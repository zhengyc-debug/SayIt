# SayIt 的 Docker Compose 配置：两个容器，一个私有网络，nginx 对外。
#
#   docker compose up -d --build     # 构建并启动
#   docker compose logs -f sayit     # 看日志（首次启动的随机 admin 密码在这里）
#   docker compose down              # 停止（数据保留在卷里）
#
# 网络模型：
#   公网 ──► nginx (暴露 80/443) ──┬─ keeplearning.icu ─► sayit:8787 ─► 豆包 wss
#                                  └─ 其它 Host/裸 IP  ─► 444 断开
#   · 只有 nginx 发布端口，sayit 在 sayit-net 内部网络上用服务名互相访问。
#   · sayit 不再发布到宿主机 —— 原来的 127.0.0.1:8787 在容器里用不上，
#     反而会和宿主机上手工跑的 nginx 抢端口。要本机调试就加 profiles: ["debug"]。
#
# 数据全部落在命名卷 sayit-data：
#   sayit.db   ← 账号 + 每人配置 + 通话记录 + 错题本 + cookie 签名密钥，全在这一个文件
#   greetings/ ← 开场白音频（空卷时从镜像自动补）
# 删容器不丢数据。

services:
  sayit:
    build:
      context: .
      dockerfile: Dockerfile
    image: sayit:latest
    container_name: sayit
    restart: unless-stopped

    # 只在本机调试时才发布端口（默认不发布，公网只能经 nginx 进来）：
    #   docker compose --profile debug up -d
    ports:
      - "127.0.0.1:8787:8787"
    profiles: ["debug"]

    volumes:
      - sayit-data:/app/data
      # 想用宿主机目录（方便备份）时换成：
      # - ./data:/app/data    # 记得 chown -R 10001:10001 ./data

    environment:
      TZ: Asia/Shanghai
      LOG_LEVEL: INFO

      # ---------------------------------------------------------------
      # 管理员密码：直接写在这里，不用 .env 文件。
      #   · 首次启动（库里还没有 admin）用它创建 admin
      #   · 已经有 admin 时**不会**覆盖 —— 后来改了这行也不会生效
      #   · 想重置：把下面 SAYIT_ADMIN_PASSWORD_FORCE 改成 "1" 重启一次，
      #             之后改回 "0"（不改回也没事，密码一致时就不会重复写库）
      # ---------------------------------------------------------------
      SAYIT_ADMIN_PASSWORD: "123456"
      SAYIT_ADMIN_PASSWORD_FORCE: "0"

      # 所有状态（账号 / 配置 / 通话记录 / cookie 签名密钥）都在
      # /app/data/sayit.db 里，不依赖任何 .env 文件。

    expose:
      - "8787"          # 只对 sayit-net 内的容器开放，不对外

    # 上面 expose 只是文档性声明，真正的边界是「不发布端口」。

    # 音频是持续的小包，给足文件句柄和网络缓冲
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/api/auth-state"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - sayit-net

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx_for_sayit
    restart: unless-stopped

    depends_on:
      sayit:
        condition: service_healthy

    ports:
      - "80:80"         # 证书验证 + HTTP→HTTPS
      - "443:443"       # 真正的入口

    volumes:
      # 整份 nginx 配置（一次性挂进去，容器里不用再改）
      - /etc/nginx/sayit.conf:/etc/nginx/conf.d/default.conf:ro
      # 证书目录：keeplearning.icu_bundle.crt / keeplearning.icu.key
      - /etc/nginx/certs:/etc/nginx/certs:ro

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - sayit-net

volumes:
  sayit-data:
    name: sayit-data

networks:
  sayit-net:
    driver: bridge
    name: sayit-net