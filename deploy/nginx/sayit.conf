# SayIt 的 nginx 站点配置（容器内路径 /etc/nginx/conf.d/default.conf）
#
# 由 docker-compose.yml 挂载进来。和「宿主机直接装 nginx」那份的区别只有一处：
#   proxy_pass http://127.0.0.1:8787  →  proxy_pass http://sayit:8787
# 容器里的 127.0.0.1 是 nginx 自己，不是 sayit；同一 compose 网络内用服务名解析。
#
# 证书放在宿主机 ./deploy/nginx/certs/：
#   keeplearning.icu_bundle.crt   （fullchain，服务器证书 + 中间证书）
#   keeplearning.icu.key
#
# 改完不用重启容器，热加载即可：
#   docker compose exec nginx nginx -t && docker compose exec nginx nginx -s reload

# WebSocket 需要把 Upgrade 头透传过去；这个 map 只能在 http{} 里定义一次。
# conf.d/*.conf 本来就被 include 在 http{} 里，所以放这里正好。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 1. 兜底：拒绝 HTTP 的 IP 直连 / 未知 Host
server {
    listen 80 default_server;
    server_name _;
    return 444;                     # 直接断开；想给提示就换成 return 403;
}

# 2. 兜底：拒绝 HTTPS 的 IP 直连 / 未知 SNI（Nginx >= 1.19.4）
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# 3. HTTP → HTTPS（顺带留一个 ACME 校验入口）
server {
    listen 80;
    server_name keeplearning.icu www.keeplearning.icu;

    # certbot --webroot 续证书时走这里；compose 已把 ./deploy/nginx/www 挂到 /var/www/certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 4. 真正的入口
server {
    listen 443 ssl;
    server_name keeplearning.icu www.keeplearning.icu;

    ssl_certificate     /etc/nginx/certs/keeplearning.icu_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/keeplearning.icu.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 8m;

    # 访问控制交给应用自己的登录（accounts 表 + 签名 cookie）。
    # 不要在这里加 auth_basic —— WebSocket 拿不到登录态，手机还会弹原生对话框。

    location / {
        proxy_pass http://sayit:8787;      # 同一 sayit-net 里的服务名
        proxy_http_version 1.1;

        # WebSocket：通话就是一条 wss 长连接
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 通话是一通几十分钟的 WS 长连接，默认 60s 空闲会被 nginx 掐断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 音频是持续的小包，缓冲只会增加延迟
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
