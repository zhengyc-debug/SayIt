# SayIt 反向代理配置（放到 /etc/nginx/sites-available/sayit）
# 把 sayit.example.com 全部换成你的域名，然后：
#   ln -s /etc/nginx/sites-available/sayit /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# 为什么用 nginx：证书续期、HTTP→HTTPS 跳转、长连接超时、限流都在这一层解决，
# 应用只监听 127.0.0.1:8787，公网碰不到它。

# WebSocket 需要把 Upgrade 头透传过去；这个 map 只能在 http{} 里定义一次
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- 80：只用来签/续证书，其余全部跳 443 ----
server {
    listen 80;
    listen [::]:80;
    server_name sayit.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- 443：真正的入口 ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sayit.example.com;

    # 路线 A：腾讯云免费证书（下载 nginx 格式的 .pem/.key 传到服务器）
    # ssl_certificate     /etc/nginx/certs/sayit.example.com_bundle.pem;
    # ssl_certificate_key /etc/nginx/certs/sayit.example.com.key;

    # 路线 B：Let's Encrypt（certbot 自动续期）
    ssl_certificate     /etc/letsencrypt/live/sayit.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sayit.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 想加一层访问密码就打开这三行（htpasswd -c /etc/nginx/.htpasswd 你的用户名）
    # auth_basic "SayIt";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 通话是一通十几分钟的 WS 长连接，默认 60s 空闲会被 nginx 掐断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 音频是持续的小包，缓冲只会增加延迟
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
