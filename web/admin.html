<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#080b12" />
<meta name="robots" content="noindex" />
<title>SayIt · 后台</title>
<link rel="icon" href="/static/icon.svg" />
<link rel="stylesheet" href="/static/styles.css" />
<script src="/static/theme.js"></script>
<style>
  /* 后台是一个表格页，宽度比手机页面宽一些 */
  .admin-page { max-width: 860px; }
  .admin-table { display: grid; gap: 10px; }
  .admin-row {
    display: grid;
    grid-template-columns: 1.1fr .9fr auto auto;
    gap: 10px;
    align-items: center;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    background: var(--surface-2);
  }
  .admin-row.off { opacity: .55; }
  .admin-row .who { min-width: 0; }
  .admin-row .who .n { font-weight: 600; font-size: 14.5px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .admin-row .who .m { font-size: 12px; color: var(--fg-3); margin-top: 3px; }
  .badge {
    display: inline-block; font-size: 11.5px; padding: 2px 7px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--fg-3); margin-left: 6px;
  }
  .badge.admin { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
  .badge.off { color: var(--err-ink); border-color: color-mix(in srgb, var(--err) 50%, transparent); }
  .admin-actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
  .form-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  @media (max-width: 620px) {
    .admin-row { grid-template-columns: 1fr auto; }
    .admin-row .role-cell { grid-column: 1 / -1; }
    .form-2col { grid-template-columns: 1fr; }
  }
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(10px);
    background: var(--surface-2); border: 1px solid var(--line-strong);
    padding: 10px 16px; border-radius: 10px; font-size: 13.5px;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { color: var(--err-ink); border-color: var(--err); }
</style>
</head>
<body>
<div class="page admin-page">

  <div class="page-head">
    <div class="grow">
      <div class="wordmark sm">Say<span>It</span><i class="dot"></i></div>
      <h1 style="margin-top:6px">后台 · 人员管理</h1>
    </div>
    <a class="btn sm" href="/">返回应用</a>
  </div>

  <h2>新增账号 <small>新建的人用这个用户名密码登录</small></h2>
  <form class="card" id="create-form" autocomplete="off">
    <div class="form-2col">
      <label class="field">用户名
        <input id="c-username" required autocapitalize="off" autocorrect="off"
               spellcheck="false" placeholder="例如 zhangsan（字母数字 _.@-）" />
      </label>
      <label class="field">显示名（可选）
        <input id="c-display" placeholder="例如 张三" />
      </label>
      <label class="field">初始密码
        <input id="c-password" type="password" required autocomplete="new-password"
               placeholder="至少 6 位" />
      </label>
      <label class="field">角色
        <select id="c-role">
          <option value="user">普通用户 user</option>
          <option value="admin">管理员 admin</option>
        </select>
      </label>
    </div>
    <div class="row">
      <button class="btn primary" id="c-submit" type="submit">创建账号</button>
      <button class="btn sm" id="c-gen" type="button">随机生成密码</button>
    </div>
  </form>

  <h2>账号列表 <small id="count"></small></h2>
  <div class="admin-table" id="list"><div class="empty">加载中…</div></div>

  <p class="hint" style="margin-top:18px">
    账号存在 data/sayit.db 的 accounts 表里。删账号不会删 TA 的通话记录。
    最后一个可用的管理员不能被删除 / 降级 / 禁用。
  </p>
</div>

<div class="toast" id="toast"></div>

<script src="/static/i18n.js"></script>
<script src="/static/nav.js"></script>
<script src="/admin.js"></script>
</body>
</html>
