<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#080b12" />
<title>SayIt · 错题本</title>
<link rel="icon" href="/static/icon.svg" />
<link rel="stylesheet" href="/static/styles.css" />
<script src="/static/theme.js"></script>
</head>
<body>
<div class="page">

  <div class="page-head">
    <div class="grow">
      <div class="wordmark sm">Say<span>It</span><i class="dot"></i></div>
      <h1 style="margin-top:6px">错题本</h1>
    </div>
    <div id="theme-host"></div>
    <div id="lang-host"></div>
  </div>

  <div class="nums" id="nums"></div>

  <h2>错误类型分布 <small>全部</small></h2>
  <div class="card" id="typedist"><div class="empty">加载中…</div></div>

  <!-- 暂时不在前端展示「不再记录的类型」规则区。后端仍在学习与生效
       （/api/error-rules、复盘过滤都正常工作），需要时把这整段和
       renderRules() 的调用一起取消注释即可。
  <h2>不再记录的类型 <small>AI 从你的删除里学到的</small></h2>
  <p class="sub">
    删掉某类错题两次以上，AI 会归纳成一条规则，之后复盘不再把这类问题记进来
    （比如 um / uh 这种思考语气词）。删掉规则，被它移出的错题会回来。
  </p>
  <div class="card tight" id="rules"><div class="empty">加载中…</div></div>
  -->

  <div class="h2row">
    <h2>按类别练 <small id="cnt"></small></h2>
    <button class="btn sm danger" id="wipe">清空错题本</button>
  </div>
  <p class="sub">错得多不要紧 —— 这里按「知识点」把错题归好组了。先点一个类别，再看这一类里
    你实际说错的句子。下次通话时 AI 会把这些场景再造一遍，让你把正确说法真正用出去。</p>

  <!-- 分类卡片：错题本首页只看这一层。点开某个类别才渲染下面的明细 -->
  <div class="catgrid" id="catgrid"></div>

  <!-- 明细：默认隐藏，点了某个类别才出现。带「返回全部类别」 -->
  <div id="detail" style="display:none">
    <div class="h2row" style="margin-top:18px">
      <h2 id="dtitle"><small id="dcnt"></small></h2>
      <button class="btn sm" id="dback">← 全部类别</button>
    </div>
    <div class="card" id="mistakes"></div>
  </div>

  <!-- 兼容旧结构：没选中分类时提示放这里 -->
  <div class="card" id="hint" style="display:none"></div>
</div>

<script src="/static/i18n.js"></script>
<script src="/static/nav.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const T = (s, v) => (window.I18N ? I18N.t(s, v) : s);
const TYPE = { grammar: '语法', tense: '时态', word: '用词', order: '语序', pronunciation: '发音' };
const TYPE_ZH = TYPE;
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let errors = [];
let rules = [];
let counts = {};
let stats = {};
let groups = [];        // [{category, label, type, count, latest, errors:[]}]
let activeCat = null;   // 当前展开的类别；null = 只显示分类卡片

const TYPE_COLOR = {
  grammar: 'var(--accent)', tense: 'var(--warn)', word: 'var(--ok)',
  order: 'var(--accent-2)', pronunciation: 'var(--err)',
};

async function loadAll() {
  const er = await fetch('/api/errors/grouped?per_category=300').then(r => r.json());
  groups = er.groups || [];
  counts = er.counts || {};
  errors = groups.flatMap(g => g.errors || []);
  rules = [];
  renderNums(); renderTypes(); renderCats();
  // 注意：这里不能无条件 hideDetail()。renderMistakes 自己会切换可见性，
  // 先 hide 再 show 的顺序一旦反了，用户点开的分类会被立刻关掉。
  if (activeCat) renderMistakes(activeCat);
  if (window.I18N) { I18N.apply(document.body); I18N.mountSwitch($('lang-host')); }
}

function fmtDate(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

/* 分类卡片：错题本首页。按「条数多的在前」排，每组显示类别名 + 条数 + 最近日期。
   点卡片 → 展开该组明细；再点「← 全部类别」回来。 */
function renderCats() {
  const host = $('catgrid');
  if (!groups.length) {
    host.innerHTML = '<div class="card"><div class="empty">还没有错误记录，打完一通电话并生成复盘后会出现。</div></div>';
    $('cnt').textContent = '';
    return;
  }
  const total = groups.reduce((n, g) => n + g.count, 0);
  $('cnt').textContent = T('{n} 类 · {m} 条', { n: groups.length, m: total });
  const max = Math.max(1, ...groups.map(g => g.count));
  host.innerHTML = groups.map(g => `
    <button class="catcard" data-cat="${esc(g.category)}">
      <div class="cc-top">
        <span class="cc-name">${esc(g.label || g.category)}</span>
        <span class="cc-n">${g.count}</span>
      </div>
      <span class="bar cc-bar"><i style="width:${(g.count / max) * 100}%;
        background:${TYPE_COLOR[g.type] || 'var(--accent)'}"></i></span>
      <div class="cc-sub">${esc(T(TYPE_ZH[g.type] || g.type))}${g.latest ? ' · 最近 ' + fmtDate(g.latest) : ''}</div>
    </button>`).join('');
  host.querySelectorAll('[data-cat]').forEach(b => {
    b.onclick = () => { activeCat = b.dataset.cat; renderMistakes(activeCat); };
  });
  // 分类卡片重建后，把可见性对齐到当前状态（没选类别时显示网格）
  host.style.display = activeCat ? 'none' : 'grid';
}

/* 明细：某一类里的全部错题，按时间倒序（最新的在最前）。 */
function renderMistakes(cat) {
  const g = groups.find(x => x.category === cat);
  const box = $('detail'), host = $('mistakes');
  // 必须写 'block'，不能写 ''：'detail' 在 HTML 里带内联 style="display:none"，
  // 赋空串只是「删掉这条内联样式」，会退回 HTML 上的 none —— 点了分类看起来没反应。
  box.style.display = 'block';
  $('catgrid').style.display = 'none';
  if (!g) { host.innerHTML = '<div class="empty">这个类别已经空了。</div>'; return; }
  $('dtitle').childNodes[0].nodeValue = g.label || g.category;
  $('dcnt').textContent = T('{n} 条', { n: g.count });
  const shown = g.errors || [];
  host.innerHTML = shown.length
    ? shown.map(e => `
        <div class="mistake">
          <div class="m-body">
            <div><span class="said">${esc(e.you_said)}</span>
                 <span style="color:var(--fg-3)">→</span>
                 <span class="better">${esc(e.better)}</span></div>
            ${e.why ? `<div class="why">${esc(e.why)}</div>` : ''}
            <div class="m-meta">${fmtDate(e.ts)}</div>
          </div>
          <button class="card-del" data-err="${e.id}" title="${T('移出错题本')}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
                 stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>`).join('')
      + (g.count > shown.length
          ? `<div class="empty" style="padding:14px 0;font-size:12.5px">${
              T('只显示最近 {n} 条，共有 {m} 条。', { n: shown.length, m: g.count })}</div>`
          : '')
    : '<div class="empty">这个类别还没有错题。</div>';

  host.querySelectorAll('[data-err]').forEach(b => {
    b.onclick = async () => {
      const node = b.closest('.mistake');
      b.disabled = true;
      if (node) node.classList.add('going');
      const r = await fetch('/api/errors/' + b.dataset.err, { method: 'DELETE' })
        .then(x => x.json()).catch(() => ({}));
      if (!r.ok) { b.disabled = false; if (node) node.classList.remove('going'); return; }
      await new Promise(res => setTimeout(res, 600));
      await loadAll();
    };
  });
}

function hideDetail() {
  $('detail').style.display = 'none';
  $('catgrid').style.display = 'grid';
}

$('dback').onclick = () => { activeCat = null; hideDetail(); };

function renderNums() {
  const mins = Math.round((stats.duration_ms || 0) / 60000);
  $('nums').innerHTML = [
    ['通话次数', stats.sessions || 0],
    ['累计时长', `${mins}<small>分</small>`],
    ['复盘报告', stats.reports || 0],
    ['累计错误', counts.visible != null ? counts.visible : errors.length],
  ].map(([k, v]) => `<div class="num"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
}

function renderTypes() {
  const c = {};
  for (const e of errors) c[e.type] = (c[e.type] || 0) + 1;
  const types = Object.entries(c).sort((a, b) => b[1] - a[1]);
  const max = Math.max(1, ...types.map(t => t[1]));
  $('typedist').innerHTML = types.length
    ? `<div style="display:flex;flex-direction:column;gap:10px">` + types.map(([t, n]) => `
        <div class="typerow">
          <span>${T(TYPE[t] || t)}</span>
          <span class="bar"><i style="width:${(n / max) * 100}%"></i></span>
          <span class="n">${n}</span>
        </div>`).join('') + '</div>'
    : '<div class="empty">还没有错误记录，打完一通电话并生成复盘后会出现。</div>';
}

/* 「不再记录的类型」：AI 从用户删掉的错题里归纳出的规则。
   删掉规则 = 这条偏好作废，被它移出的错题会回到下面的列表。 */
// 规则区暂时不在页面上：#rules 不存在时直接返回，函数留着方便恢复
function renderRules() {
  const host = $('rules');
  if (!host) return;
  if (!rules.length) {
    const removed = counts.hidden || 0;
    host.innerHTML = `<div class="empty" style="padding:18px 0">
      ${T('还没学到规则。')}<br>
      <span style="font-size:12px">${removed
        ? T('已经移出 {n} 条错题，同类再多删一条就能归纳出规则。', { n: removed })
        : T('在下面删掉不认同的错题，同类删两次之后这里会出现规则。')}</span>
      <div style="margin-top:10px"><button class="btn sm" id="learn">${T('现在就归纳一次')}</button></div>
    </div>`;
    $('learn').onclick = learnNow;
    return;
  }
  host.innerHTML = rules.map(r => `
    <div class="rule">
      <div class="rt"><span class="r-txt">${esc(r.rule)}</span>
        ${r.pattern ? `<span class="r-pat">${esc(r.pattern)}</span>` : ''}</div>
      <div class="r-sub">${r.hits ? T('已帮你挡掉 {n} 条', { n: r.hits }) : T('规则已生效')}</div>
      <button class="card-del" data-rule="${r.id}" title="${T('删掉这条规则')}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>`).join('');
  host.querySelectorAll('[data-rule]').forEach(b => {
    b.onclick = async () => {
      b.disabled = true;
      await fetch('/api/error-rules/' + b.dataset.rule, { method: 'DELETE' }).catch(() => {});
      await loadAll();
    };
  });
}

async function learnNow() {
  const btn = $('learn');
  if (btn) { btn.disabled = true; btn.textContent = T('归纳中…'); }
  await fetch('/api/error-rules/learn', { method: 'POST' }).catch(() => {});
  await loadAll();
}

// 清空错题本：点了就清，不做二次确认
$('wipe').onclick = async () => {
  const btn = $('wipe');
  btn.disabled = true;
  const r = await fetch('/api/errors', { method: 'DELETE' }).then(x => x.json()).catch(() => ({}));
  btn.disabled = false;
  if (!r.ok) { alert(T('清空失败，再试一次')); return; }
  await loadAll();
};

(async () => {
  stats = await fetch('/api/stats').then(r => r.json()).catch(() => ({}));
  await loadAll();
})().catch(e => {
  $('mistakes').innerHTML = `<div class="empty" style="color:#ffb3b3">加载失败：${esc(e.message)}</div>`;
});
</script>
</body>
</html>
