<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#080b12" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>SayIt · 口语陪练</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/static/icon.svg" />
<link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="call-page">

<div class="shell">

  <header class="topbar">
    <div class="wordmark">Say<span>It</span><i class="dot"></i></div>
    <div class="grow"></div>
    <!-- 右上角切换的是「我的母语」，只影响界面文案和复盘解释；练习语言在下面那一排 -->
    <div id="lang-host"></div>
  </header>

  <section class="setup">
    <div class="setup-row">
      <span class="setup-label">场景</span>
      <div class="chiprow" id="row-scen"></div>
    </div>
    <div class="setup-row">
      <span class="setup-label">语言</span>
      <div class="chiprow" id="row-meta"></div>
    </div>
  </section>

  <main class="stage">

    <div class="peer">
      <div class="avatar-wrap" id="avatar-wrap">
        <div class="ring"></div><div class="ring"></div><div class="ring"></div>
        <div class="avatar" id="avatar">E</div>
      </div>
      <div class="peer-txt">
        <div class="peer-name" id="who-name">Emma</div>
        <div class="peer-sub" id="who-sub">日常闲聊 · English · B1</div>
      </div>
      <div class="state" id="status">待机</div>
    </div>

    <div class="captions" id="captions"></div>

    <div class="idle" id="idle">
      <a class="recap" id="recap" href="/history" style="display:none"></a>
      <div class="tips" id="idle-tips">
        <span><b>🎙</b> 直接开口说英文，不用按任何键</span>
        <span><b>✋</b> 你一说话，它会立刻停下来听</span>
        <span><b>📝</b> 挂断后自动生成复盘和错题</span>
      </div>
    </div>

  </main>

  <div class="dock">
    <button class="round" id="btn-mute" title="静音">
      <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2.8" width="6" height="10.6" rx="3" />
        <path d="M5.4 11.4a6.6 6.6 0 0 0 13.2 0" /><path d="M12 17.9v3.3" />
      </svg>
      <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2.8" width="6" height="10.6" rx="3" />
        <path d="M5.4 11.4a6.6 6.6 0 0 0 13.2 0" /><path d="M12 17.9v3.3" />
        <path d="M3.6 3.2 20.4 21.4" />
      </svg>
    </button>
    <button class="call-btn" id="btn-call" title="开始通话">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6.4 3.4h2.9l1.5 3.9-1.9 1.4a11.6 11.6 0 0 0 5.4 5.4l1.4-1.9 3.9 1.5v2.9a1.9 1.9 0 0 1-2.1 1.9A16.9 16.9 0 0 1 4.5 5.5 1.9 1.9 0 0 1 6.4 3.4z" />
      </svg>
      <span class="lbl">开始通话</span>
    </button>
  </div>

</div>

<div class="toast" id="toast"></div>

<div class="modal" id="report-modal" aria-hidden="true">
  <div class="modal-card">
    <div class="modal-head">
      <div>
        <h3>这通电话复盘</h3>
        <div class="sub" id="rp-sub">正在生成…</div>
      </div>
      <button class="icon-btn" id="rp-close" title="关闭">✕</button>
    </div>
    <div class="modal-body" id="rp-body">
      <div class="rp-loading"><span class="spinner"></span> 正在分析你的表达…</div>
    </div>
    <div class="modal-foot">
      <a class="btn" href="/stats">看错题本</a>
      <button class="btn primary" id="rp-again">再打一通</button>
    </div>
  </div>
</div>

<script src="/static/i18n.js"></script>
<script src="/static/nav.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
